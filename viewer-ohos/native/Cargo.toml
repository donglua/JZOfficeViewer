[package]
name = "jz-office-ohos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "jz_office_ohos"
crate-type = ["cdylib"]
test = false
doctest = false

[dependencies]
jz-office-core = { path = "../../core" }
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
napi-ohos = { version = "=1.2.0", default-features = false, features = ["napi8", "async"] }
napi-derive-ohos = "=1.2.0"
serde_json = "=1.0.149"

[build-dependencies]
napi-build-ohos = "=1.2.0"

[lints]
workspace = true
