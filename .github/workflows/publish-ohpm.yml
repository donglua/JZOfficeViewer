name: Publish HAR to OHPM

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      version:
        description: Existing v-prefixed release tag version to publish (e.g. 0.3.0)
        required: true
        default: 0.3.0
        type: string

permissions:
  contents: read

concurrency:
  group: ohpm-publish
  cancel-in-progress: false

jobs:
  publish-har:
    name: Build and publish HAR to OHPM
    permissions:
      contents: write
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'release' && !github.event.release.draft && !github.event.release.prerelease)
    runs-on: ubuntu-latest

    steps:
      - name: Resolve release version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          MANUAL_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == release ]]; then
            version="${RELEASE_TAG#v}"
          else
            version="${MANUAL_VERSION#v}"
          fi
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::Expected a stable version such as 1.0.0 or v1.0.0.'
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.ref || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up Rust
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
          rustup target add aarch64-unknown-linux-ohos x86_64-unknown-linux-ohos armv7-unknown-linux-ohos
          cargo install ohrs

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev expect

      - name: Setup HarmonyOS / OpenHarmony CLI tools
        uses: ErBWs/setup-ohos@v2
        with:
          version: '26.0.0.821'
          cache: true

      - name: Build HarmonyOS HAR via build-ohos.sh
        run: |
          chmod +x scripts/build-ohos.sh
          ./scripts/build-ohos.sh

      - name: Setup OHPM Credentials
        env:
          OHPM_PUBLISH_ID: ${{ secrets.OHPM_PUBLISH_ID }}
          OHPM_KEY: ${{ secrets.OHPM_KEY }}
        run: |
          KEY_PATH="$HOME/.ohpm/key.pem"
          mkdir -p "$(dirname "$KEY_PATH")"
          printf "%s\n" "$OHPM_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          ohpm config set publish_id "$OHPM_PUBLISH_ID"
          ohpm config set key_path "$KEY_PATH"

      - name: Publish HAR to OHPM
        env:
          OHPM_KEY_PASSPHRASE: ${{ secrets.OHPM_KEY_PASSPHRASE }}
        run: |
          HAR_PATH="viewer-ohos/build/default/outputs/default/viewer_ohos.har"
          if [[ ! -f "$HAR_PATH" ]]; then
            echo "::error::HAR file not found at $HAR_PATH"
            exit 1
          fi
          chmod +x scripts/publish-ohpm.py
          ./scripts/publish-ohpm.py "$HAR_PATH"

      - name: Attach HAR to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name || format('v{0}', steps.version.outputs.version) }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          HAR_PATH="viewer-ohos/build/default/outputs/default/viewer_ohos.har"
          TARGET_NAME="jzdy-office-${RELEASE_VERSION}.har"
          cp -f "$HAR_PATH" "$TARGET_NAME"
          gh release upload "$RELEASE_TAG" "$TARGET_NAME" --clobber || echo "::warning::Could not upload HAR to release assets"
