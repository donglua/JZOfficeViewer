name: Android Accessibility Device Tests

on:
  workflow_dispatch:
    inputs:
      api_level:
        description: 'Android API level for emulator (e.g. 34, 32, 30)'
        required: false
        default: '34'

permissions:
  contents: read

concurrency:
  group: accessibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-accessibility:
    name: Android Accessibility Device Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Install Android SDK, NDK and emulator image
        run: |
          api="${{ inputs.api_level || '34' }}"
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358" \
            "emulator" "system-images;android-${api};default;x86_64"

      - name: Set up Rust
        run: |
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0

      - name: Build instrumentation APK
        run: ./gradlew --no-daemon --stacktrace :viewer:assembleDebugAndroidTest -PofficeAbis=x86_64

      # 模拟器上探针无障碍服务可能写入成功却不绑定，此时播报断言 SKIP；
      # 其余 44 项断言仍是硬门禁（失败即让任务红）。
      - name: Run accessibility suite on emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: ${{ inputs.api_level || '34' }}
          target: default
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: -no-snapshot-save -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: OFFICE_ALLOW_SKIP=1 ./scripts/run-accessibility-device-checks.sh

      - name: Upload instrumentation log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: accessibility-device-log
          path: build/device-checks/accessibility.log
