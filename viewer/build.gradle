plugins {
    id 'com.android.library'
}

abstract class GenerateOfficeFixtures extends Exec {
    @OutputDirectory
    abstract org.gradle.api.file.DirectoryProperty getOutputDirectory()
}

group = rootProject.publishedGroupId
version = rootProject.publishedVersion

android {
    enableKotlin = false
    namespace 'cn.jingzhuan.lib.office'
    compileSdk 35
    ndkVersion '28.2.13676358'
    defaultConfig {
        minSdk 23
        testInstrumentationRunner 'cn.jingzhuan.lib.office.OfficeInstrumentation'
        consumerProguardFiles 'consumer-rules.pro'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

def officeAbis = providers.gradleProperty('officeAbis').getOrElse('arm64-v8a,armeabi-v7a').split(',').toList()
if (!officeAbis.every { it in ['arm64-v8a', 'x86_64', 'armeabi-v7a'] }) {
    throw new GradleException('officeAbis supports arm64-v8a,x86_64,armeabi-v7a')
}
def nativeOutput = layout.buildDirectory.dir('generated/jniLibs/' + officeAbis.join('_'))
android.sourceSets.main.jniLibs.srcDir(nativeOutput.get().asFile)
def testFixtures = layout.buildDirectory.dir('generated/test-fixtures')
android.sourceSets.androidTest.assets.srcDir(rootProject.file('demo/src/main/assets'))
def cargoHomeBin = new File(System.getProperty('user.home'), '.cargo/bin')
def cargoBinFile = new File(cargoHomeBin, 'cargo')
def cargoCmd = cargoBinFile.exists() ? cargoBinFile.absolutePath : 'cargo'

def generateTestFixtures = tasks.register('generateTestFixtures', GenerateOfficeFixtures) {
    inputs.files(rootProject.fileTree('core/tests/support'), rootProject.file('core/examples/fixtures.rs'), rootProject.file('Cargo.lock'))
    outputDirectory.set(testFixtures)
    workingDir rootProject.projectDir
    if (cargoHomeBin.exists()) {
        environment 'PATH', "${cargoHomeBin.absolutePath}:${System.getenv('PATH') ?: ''}"
    }
    commandLine([cargoCmd, 'run', '-p', 'jz-office-core', '--example', 'fixtures']
        + (gradle.startParameter.offline ? ['--offline'] : []) + ['--', '--tests', testFixtures.get().asFile.absolutePath])
}
androidComponents.onVariants(androidComponents.selector().all()) { variant ->
    variant.androidTest?.sources?.assets?.addGeneratedSourceDirectory(generateTestFixtures) { it.outputDirectory }
}
tasks.register('buildNative', Exec) {
    inputs.files(rootProject.fileTree('core') { exclude 'target/**' }, rootProject.fileTree('viewer/native'), rootProject.file('Cargo.toml'), rootProject.file('Cargo.lock'), rootProject.file('scripts/build-native.sh'))
    inputs.property('abis', officeAbis)
    outputs.dir(nativeOutput)
    workingDir rootProject.projectDir
    environment 'ANDROID_NDK_HOME', androidComponents.sdkComponents.ndkDirectory.get().asFile.absolutePath
    environment 'OFFICE_OFFLINE', gradle.startParameter.offline.toString()
    if (cargoHomeBin.exists()) {
        environment 'PATH', "${cargoHomeBin.absolutePath}:${System.getenv('PATH') ?: ''}"
    }
    commandLine(['bash', rootProject.file('scripts/build-native.sh').absolutePath, nativeOutput.get().asFile.absolutePath] + officeAbis)
}
tasks.named('preBuild').configure { dependsOn tasks.named('buildNative') }

apply from: rootProject.file('gradle/publish-library.gradle')

tasks.register('publishToSonatype') {
    group = 'publishing'
    description = 'Publishes both libraries through the root release task.'
    dependsOn rootProject.tasks.named('publishToSonatype')
}
